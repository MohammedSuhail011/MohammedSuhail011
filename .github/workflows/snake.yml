name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MohammedSuhail011
          outputs: |
            outputs: |
              dist/github-snake.svg?palette=github-light&color_snake=D8B4FE&color_dots=%23ebedf0,%23d8b4fe,%23c084fc,%23a78bfa,%238b5cf6
              dist/github-snake-dark.svg?palette=github-dark&color_snake=D8B4FE&color_dots=%23555B6E,%23747A8A,%237C3AED,%23A78BFA,%23C084FC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
